# Netlify serves .webmanifest as application/octet-stream by default, which
# some browsers refuse to parse as a manifest.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Baseline security headers for every response. No Content-Security-Policy:
# the pages use inline scripts and third-party fonts and images, and a policy
# strict enough to matter needs its own audit rather than a guess.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

