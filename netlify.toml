# Komposite News — prerendered static bundle, no build step.
# The repository root IS the site, so publish from "." and run no command.

[build]
  command = ""
  publish = "."

# Canonical host is https://kompositenews.com with no www. Netlify already
# performs both redirects for the primary domain; these make the rule explicit
# and version-controlled so it survives any change of primary domain.

[[redirects]]
  from = "https://www.kompositenews.com/*"
  to = "https://kompositenews.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.kompositenews.com/*"
  to = "https://kompositenews.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://kompositenews.com/*"
  to = "https://kompositenews.com/:splat"
  status = 301
  force = true

# Netlify serves .webmanifest as application/octet-stream by default, which
# some browsers refuse to parse as a manifest.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
