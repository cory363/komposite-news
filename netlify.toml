# Komposite News — prerendered static bundle, no build step.
# The repository root IS the site, so publish from "." and run no command.

[build]
  command = ""
  publish = "."

# Canonical host is https://kompositenews.com with no www. Netlify already
# performs both redirects for the primary domain; these make the rule explicit
# and version-controlled so it survives any change of primary domain.

[[redirects]]
  from = "https://www.kompositenews.com/*"
  to = "https://kompositenews.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.kompositenews.com/*"
  to = "https://kompositenews.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://kompositenews.com/*"
  to = "https://kompositenews.com/:splat"
  status = 301
  force = true

# Netlify serves .webmanifest as application/octet-stream by default, which
# some browsers refuse to parse as a manifest.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Baseline security headers for every response. No Content-Security-Policy:
# the pages use inline scripts and third-party fonts and images, and a policy
# strict enough to matter needs its own audit rather than a guess.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
